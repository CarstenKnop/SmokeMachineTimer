; FogMachineRemoteControl - battery remote for up to 10 smoke-machine timers (Seeed XIAO ESP32-C3 + SSD1306 OLED).
;
; The platform version is pinned (Arduino-ESP32 3.3.x / ESP-IDF 5.5) so every build is reproducible.
; No upload/monitor port is set: PlatformIO picks the connected board. To force one:
;   pio run -t upload --upload-port COM5
[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform = espressif32@8.0.0
board = seeed_xiao_esp32c3
framework = arduino
; 3 MB app slot (OTA is not used); NVS keeps its address so saved settings survive the change
board_build.partitions = huge_app.csv
monitor_speed = 115200
debug_tool = esp-builtin
debug_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.4.2
build_flags =
    -std=gnu++17
    -Wall
    -Wno-unused-variable
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
