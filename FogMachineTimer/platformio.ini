; FogMachineTimer - ESP32-C3 timer for one smoke machine.
;
; The platform version is pinned (Arduino-ESP32 3.3.x / ESP-IDF 5.5) so every build is reproducible.
; No upload/monitor port is set on purpose: PlatformIO picks the connected board, which is what you want
; with ten timers on the bench. To force one:  pio run -t upload --upload-port COM7
[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform = espressif32@8.0.0
board = seeed_xiao_esp32c3
framework = arduino
; two 1.875 MB application slots (over-the-air update, docs/OTA_UPDATE.md); NVS keeps its address so saved settings survive the change
board_build.partitions = ../partitions/fog_ota.csv
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
build_flags =
    -std=gnu++17
    -Wall
    -Wno-unused-variable
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
; Wiring overrides (see src/Pins.h):
;   -DFOG_OUTPUT_GPIO=5  -DFOG_OUTPUT_ACTIVE_HIGH=1  -DFOG_STATUS_LED_GPIO=2
